<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#13221B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Date el Gusto">
<title>Date el Gusto POS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: app de punto de venta — barra lateral oscura con navegación por módulo, área de trabajo clara; comandas como tiquete térmico */
:root{
  --bg:#F2F4F1; --surface:#FFFFFF; --surface-2:#E8ECE7; --line:#D3DAD3; --fg:#17201B; --muted:#5B675F;
  --accent:#1D6A4C; --accent-ink:#FFFFFF; --accent-soft:#DAEDE3;
  --warn:#9A6212; --warn-soft:#FBEED6; --bad:#B42318; --bad-soft:#FBE3DF; --info:#2457A6; --info-soft:#E0E9F8;
  --paper:#FFFDF6; --ink:#1A1A1A; --paper-line:#D9D3C2;
  --side:#13221B; --side-fg:#DCE8E0; --side-muted:#8DA497; --side-hi:#1F3A2D;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Figtree", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1411; --surface:#161F1A; --surface-2:#1E2923; --line:#2B3831; --fg:#E5EEE8; --muted:#93A59B;
  --accent:#3DB484; --accent-ink:#06130D; --accent-soft:#183A2B;
  --warn:#E3A94C; --warn-soft:#3A2B12; --bad:#F2796C; --bad-soft:#3E1B17; --info:#82A9EE; --info-soft:#1A2640;
  --paper:#EEE9DC; --ink:#1A1A1A; --paper-line:#CFC7B2;
  --side:#09100C; --side-fg:#D5E2DA; --side-muted:#7F968A; --side-hi:#16281F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1411; --surface:#161F1A; --surface-2:#1E2923; --line:#2B3831; --fg:#E5EEE8; --muted:#93A59B;
  --accent:#3DB484; --accent-ink:#06130D; --accent-soft:#183A2B;
  --warn:#E3A94C; --warn-soft:#3A2B12; --bad:#F2796C; --bad-soft:#3E1B17; --info:#82A9EE; --info-soft:#1A2640;
  --paper:#EEE9DC; --ink:#1A1A1A; --paper-line:#CFC7B2;
  --side:#09100C; --side-fg:#D5E2DA; --side-muted:#7F968A; --side-hi:#16281F; color-scheme:dark}

[hidden]{display:none!important}
body{margin:0}
img{max-width:100%}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:1.35rem;font-weight:700}
h3{font-size:1rem;font-weight:700}
.muted{color:var(--muted)} .small{font-size:.82rem}
.num,.m-total,.acc-t,.pd-t,.l-p{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:228px 1fr;height:100%}
.side{background:var(--side);color:var(--side-fg);display:flex;flex-direction:column;padding:18px 12px;gap:18px;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;padding:0 8px}
.brand-mark{width:34px;height:34px;border-radius:9px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);font-family:var(--f-display);font-weight:800;font-size:1.1rem}
.brand-logo{width:40px;height:40px;border-radius:50%;object-fit:cover;flex:none;background:#FFC928}
.lk .brand-logo{width:72px;height:72px}
.brand b{font-family:var(--f-display);font-size:1.15rem;display:block;line-height:1.1}
.brand span{font-size:.75rem;color:var(--side-muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:11px;background:none;border:0;color:var(--side-fg);padding:9px 10px;border-radius:8px;cursor:pointer;text-align:left;font-weight:500;position:relative}
.nav button svg{width:19px;height:19px;flex:none;opacity:.85}
.nav button:hover{background:var(--side-hi)}
.nav button.on{background:var(--side-hi);color:#fff}
.nav button.on::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
.nav .badge{margin-left:auto;background:var(--accent);color:var(--accent-ink);font-size:.72rem;font-weight:700;border-radius:20px;padding:1px 7px;font-variant-numeric:tabular-nums}
.nav .badge.warn{background:var(--warn);color:#1a1205}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding:0 6px;font-size:.78rem;color:var(--side-muted)}
.side-foot button{background:none;border:1px solid var(--side-hi);color:var(--side-muted);border-radius:8px;padding:7px;cursor:pointer}
.side-foot button:hover{color:var(--side-fg)}

.main{overflow:auto;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:14px 12px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
.top h1{font-size:1.5rem;font-weight:800}
.top .sub{color:var(--muted);font-size:.85rem}
.top-r{margin-left:auto;display:flex;align-items:center;gap:12px}
.clock{font-family:var(--f-mono);font-weight:500;color:var(--muted)}
.role{display:flex;align-items:center;gap:6px;font-size:.82rem;color:var(--muted)}
.role select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
#view{padding-block:16px 40px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px;min-width:0}

/* controles */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 13px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.dark{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.btn.ok{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.btn.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.btn.ghost{background:none;border-color:transparent;padding-left:4px}
.btn.link{background:none;border:0;padding:4px;font-weight:500;text-decoration:underline;text-underline-offset:3px}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 9px;font-size:.82rem}
.btn.big{padding:12px 16px;font-size:1rem}
.btn.block{width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>.btn{flex:1}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--surface-2);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{background:none;border:0;padding:6px 12px;border-radius:7px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:20px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--accent-soft);color:var(--accent)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--info-soft);color:var(--info)}
.count{font-family:var(--f-mono);font-size:.78rem;background:var(--surface-2);border-radius:20px;padding:1px 8px;color:var(--muted);font-weight:500}
.empty{color:var(--muted);font-size:.88rem;margin:6px 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel{display:flex;flex-direction:column;gap:12px;min-width:0}
.split{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;align-items:start}
.field{display:flex;flex-direction:column;gap:5px;font-size:.84rem;color:var(--muted);font-weight:500;min-width:0}
.field input,.field select,.field textarea,input[type=search]{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;color:var(--fg);width:100%;min-width:0}
.field.inline{flex-direction:row;align-items:center;gap:8px}
.field.inline select{width:auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* mesas */
.legend{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.lg{font-size:.78rem;font-weight:600;padding:4px 10px 4px 22px;border-radius:20px;background:var(--surface);border:1px solid var(--line);position:relative}
.lg::before{content:"";position:absolute;left:9px;top:50%;width:8px;height:8px;margin-top:-4px;border-radius:50%}
.lg.libre::before{background:var(--line)} .lg.ocupada::before{background:var(--accent)} .lg.cuenta::before{background:var(--warn)} .lg.reservada::before{background:var(--info)}
.zone-h{font-size:.74rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;grid-column:1/-1;margin-top:4px}
.floor{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.mesa{position:relative;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px 14px 12px;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-height:128px;transition:transform .12s ease, box-shadow .12s ease}
.mesa:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(0,0,0,.07)}
.mesa.wide{grid-column:span 2}
.m-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.m-num{font-family:var(--f-display);font-size:1.7rem;font-weight:800;line-height:1;margin-right:auto}
.m-state{font-weight:700;font-size:.86rem;margin-top:4px}
.m-meta{font-size:.8rem;color:var(--muted)}
.m-total{font-family:var(--f-mono);font-weight:700;margin-top:auto;font-size:.95rem}
.seats{display:flex;gap:3px;margin-top:6px}
.seats i{width:7px;height:7px;border-radius:2px;background:var(--surface-2);border:1px solid var(--line)}
.st-libre .m-state{color:var(--muted)}
.st-ocupada{border-color:var(--accent);background:linear-gradient(var(--accent-soft),var(--accent-soft)) top/100% 5px no-repeat,var(--surface)}
.st-ocupada .m-state{color:var(--accent)} .st-ocupada .seats i{background:var(--accent);border-color:var(--accent)}
.st-cuenta{border-color:var(--warn);background:var(--warn-soft)} .st-cuenta .m-state{color:var(--warn)} .st-cuenta .seats i{background:var(--warn);border-color:var(--warn)}
.st-reservada{border-style:dashed;border-color:var(--info)} .st-reservada .m-state{color:var(--info)}
.srv{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;padding:10px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent)}
.srv-items{font-size:.84rem;margin-top:2px}
.nxt{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.nxt:last-child{border-bottom:0}
.nxt .t{font-family:var(--f-mono);font-weight:700;min-width:64px}

/* comandero */
.ord-h{display:flex;flex-direction:column;margin-right:auto;min-width:0}
.pos{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:18px;align-items:start}
.menu{display:flex;flex-direction:column;gap:12px;min-width:0}
.menu-tools{display:flex;flex-direction:column;gap:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:6px 13px;cursor:pointer;font-weight:600;font-size:.86rem}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.prod{position:relative;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:112px}
.prod:hover:not(:disabled){border-color:var(--accent)}
.prod:active:not(:disabled){transform:scale(.98)}
.prod:disabled{opacity:.5;cursor:not-allowed}
.p-n{font-weight:700;line-height:1.2}
.p-d{font-size:.78rem;color:var(--muted);line-height:1.3}
.p-p{font-family:var(--f-mono);font-weight:700;margin-top:auto}
.p-st{font-size:.68rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
.p-q{position:absolute;top:8px;right:8px;background:var(--accent);color:var(--accent-ink);border-radius:20px;min-width:24px;height:24px;display:grid;place-items:center;font-weight:700;font-size:.8rem;padding:0 6px}
.ticket{position:sticky;top:82px;background:var(--surface);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;max-height:calc(100vh - 110px);min-width:0}
.tk-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.lines{overflow:auto;padding:4px 16px;flex:1;min-height:80px}
.line{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:4px 10px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.line:last-child{border-bottom:0}
.l-main{display:flex;flex-direction:column;min-width:0}
.l-n{font-weight:600}
.l-nota{font-size:.78rem;color:var(--warn);font-style:italic}
.l-st{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.line.sent .l-st{color:var(--accent)}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);cursor:pointer;font-weight:700;font-size:1rem;line-height:1}
.qty span{min-width:18px;text-align:center;font-weight:700}
.q-fixed{font-family:var(--f-mono);font-weight:700}
.l-p{font-family:var(--f-mono);font-weight:700;text-align:right;min-width:78px}
.l-nb{grid-column:1/-1;justify-self:start;background:none;border:0;padding:0;color:var(--muted);font-size:.78rem;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.sums{padding:12px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:3px}
.sums>div:not(.small){display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
.sums .grand{font-family:var(--f-display);font-size:1.35rem;font-weight:800;margin-top:4px}
.tk-actions{padding:0 16px 16px;display:flex;flex-direction:column;gap:8px}
.fab{display:none}

/* cocina */
.kds{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
.kcol{display:flex;flex-direction:column;gap:12px;min-width:0}
.kcol-h{display:flex;align-items:center;gap:8px;padding-bottom:6px;border-bottom:2px solid var(--line)}
.tk{background:var(--paper);color:var(--ink);border-radius:4px 4px 0 0;padding:14px 14px 16px;display:flex;flex-direction:column;gap:10px;box-shadow:0 2px 6px rgba(0,0,0,.08);position:relative;
  -webkit-mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/14px 100%;mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/14px 100%;padding-bottom:22px}
.tk header{display:flex;align-items:baseline;gap:8px;border-bottom:1px dashed var(--paper-line);padding-bottom:8px}
.tk-num{font-family:var(--f-mono);font-weight:700;font-size:1.05rem}
.tk-for{font-weight:700;margin-right:auto}
.tk-time{font-family:var(--f-mono);font-weight:700;font-size:.9rem;padding:1px 7px;border-radius:5px;background:#E7E2D3}
.tk-time.slow{background:#F6DFAE;color:#5C3B00}
.tk-time.late{background:#B42318;color:#fff}
.tk-meta{display:flex;gap:8px;flex-wrap:wrap;font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;font-weight:700;color:#5d5a50}
.svc{border-radius:4px;padding:1px 6px}
.tk .svc-mesa{background:#DCEADF;color:#1D5A40} .tk .svc-domicilio{background:#DCE4F4;color:#23467F} .tk .svc-llevar{background:#F3E3C4;color:#6A4708}
.tk ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.tk li{display:flex;gap:10px;font-size:1.02rem;line-height:1.25}
.tk li b{font-family:var(--f-mono);min-width:26px}
.tk li em{display:block;font-size:.82rem;font-style:normal;font-weight:700;color:#9A3412}
.tk .btn{background:#fff;border-color:#CFC7B2;color:var(--ink)}
.tk .btn.primary{background:#1D6A4C;border-color:#1D6A4C;color:#fff}
.tk .btn.ok{background:#DCEADF;color:#1D5A40}

/* caja */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi span{font-size:.78rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.kpi b{font-family:var(--f-display);font-size:1.5rem;font-weight:800;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.acc{display:flex;flex-direction:column}
.acc-row{display:flex;align-items:center;gap:12px;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 4px;text-align:left;cursor:pointer;width:100%}
.acc-row:hover{background:var(--surface-2)}
.acc-row:last-child{border-bottom:0}
.acc-l{display:flex;flex-direction:column;margin-right:auto;min-width:0}
.acc-t{font-family:var(--f-mono);font-weight:700;font-size:1rem}
.pay-row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-variant-numeric:tabular-nums}
.pay-row>span:first-child{display:flex;flex-direction:column}

/* pedidos */
.kanban{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
.kanban.k4{grid-template-columns:repeat(4,minmax(0,1fr))}
.opc-g{display:flex;flex-direction:column;gap:8px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}
.opc-h{display:flex;gap:8px;align-items:center}
.opc-h input,.opc-g textarea{flex:1;min-width:0;width:100%;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:8px 10px;font:inherit}
.opc-h input{font-weight:700}
.opc-g .chip input{margin:0 6px 0 0;accent-color:var(--accent)}
.opc-g .chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--fg)}
.tramo{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tramo input{width:90px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:7px 9px;font:inherit}
#localTxt{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:8px 10px;font:inherit;width:100%}
.card.conn{display:flex;flex-direction:row;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px;border-color:var(--warn);background:var(--warn-soft)}
.card.conn>div{flex:1 1 260px;display:flex;flex-direction:column;gap:2px;min-width:0}
.card.conn input{flex:1 1 160px;min-width:0;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;padding:10px 12px;font:inherit}
@media (max-width:1250px){.kanban.k4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.pd.por-aprobar{border-color:var(--warn);box-shadow:0 0 0 3px var(--warn-soft)}
.pd-items div+div{margin-top:3px}
.pd.rp .rp-dir{font-size:1.08rem;font-weight:700;line-height:1.25}
.pd .row a.btn{text-decoration:none;color:var(--fg)}
.cmp{display:grid;place-items:center;background:var(--surface-2);border-radius:12px;min-height:180px;overflow:hidden}

function cambios(){

}

function mesaInfo(m){
  const o=ordenMesa(m.id);
  if(o){const cs=cmdsOf(o);return{o,estado:o.cuentaPedida?'cuenta':'ocupada',listo:cs.some(c=>c.estado==='listo'),pend:o.items.some(l=>!l.env&&l.est)}}
  const r=S.reservas.find(r=>r.mesaId===m.id&&['pendiente','confirmada'].includes(r.estado)&&r.t-now()<90*MIN&&r.t-now()>-20*MIN);
  return{estado:r?'reservada':'libre',r};
}

/* ---------- acciones de negocio ---------- */
function nuevaOrden(data){const o=Object.assign({id:uid('o'),num:S.num++,estado:'abierta',cuentaPedida:false,entrega:'pendiente',creada:now(),items:[],cliente:'',canal:'Salón',mesero:S.meseros[0]},data);S.ordenes.push(o);return o}
function addItem(o,pid,cant=1,nota=''){const p=prod(pid);if(!p||!p.disp)return;const ex=o.items.find(l=>l.pid===pid&&!l.env&&!l.nota&&!nota);if(ex)ex.cant+=cant;else o.items.push({id:uid('l'),pid,nombre:p.nombre,precio:p.precio,cant,nota,env:false,est:p.est})}
function enviarCocina(o){
  const nuevos=o.items.filter(l=>!l.env);if(!nuevos.length)return 0;
  const porEst={};
  nuevos.forEach(l=>{l.env=true;if(!l.est)return;(porEst[l.est]=porEst[l.est]||[]).push({nombre:l.nombre,cant:l.cant,nota:l.nota});
    const p=prod(l.pid);if(p)p.receta.forEach(([iid,q])=>{const i=S.insumos.find(x=>x.id===iid);if(i){i.stock-=q*l.cant;if(API.url)MOVS.push({insumo:iid,cantidad:-q*l.cant,motivo:'Venta',ref:label(o)+' · '+l.cant+'× '+l.nombre,t:now()})}})});
  const nums=[];
  Object.entries(porEst).forEach(([est,items])=>{const n=S.seq++;nums.push(n);S.comandas.push({id:uid('c'),num:n,ordenId:o.id,est,items,estado:'nuevo',t:now(),tListo:null})});
  return nums;
}

/* ---------- comprobantes de pago ---------- */
const CMP={};
async function cargarComprobante(o){
  if(CMP[o.id]&&CMP[o.id]!=='cargando')return;
  if(!API.url){let d=null;try{d=localStorage.getItem(K+'_cmp_'+o.id)}catch(e){}CMP[o.id]=d||'x';renderModal();return}
  if(!o.comprobante){CMP[o.id]='x';renderModal();return}
  CMP[o.id]='cargando';
  try{const r=await fetch(API.url+'?action=comprobante&token='+encodeURIComponent(API.token)+'&id='+encodeURIComponent(o.id));const j=await r.json();CMP[o.id]=j.ok&&j.data?j.data:'x'}
  catch(e){delete CMP[o.id];toast('No se pudo cargar el comprobante. Revisa el internet.','bad')}
  if(U.modal&&U.modal.type==='comprobante')renderModal();
}

/* ---------- puente de prueba: la carta del cliente y la app en el mismo navegador, sin hoja ---------- */
function estadoCliente(o){const cs=cmdsOf(o);let e;
  if(o.aprobacion==='rechazado')e='rechazado';else if(o.estado==='anulada')e='anulado';
  else if(o.entrega==='entregado')e='entregado';else if(o.entrega==='en_camino')e='camino';
  else if(o.aprobacion==='pendiente')e='por_aprobar';else if(o.items.some(l=>!l.env&&l.est))e='por_confirmar';
  else if(!cs.length)e='recibido';else if(cs.every(c=>c.estado==='listo'||c.estado==='entregado'))e='listo';
  else if(cs.some(c=>c.estado!=='nuevo'))e='preparando';else e='recibido';
  return{num:o.num,tipo:o.tipo,estado:e,mesa:'',items:o.items.map(l=>({nombre:l.nombre,cant:l.cant,precio:l.precio,nota:l.nota})),total:total(o),
    pagoPreferido:o.pagoPreferido||'',motivoRechazo:o.motivoRechazo||'',domiciliario:o.domiciliario||'',pagado:o.estado==='pagada',cuentaPedida:false}}
function publicarEstados(){
  if(API.url)return;const m={};const lim=now()-2*86400000;
  S.ordenes.filter(o=>o.canal==='Web'&&o.creada>lim).forEach(o=>{m[o.id]=estadoCliente(o)});
  try{localStorage.setItem(K+'_estados',JSON.stringify(m))}catch(e){}
}
function recibirBuzon(){
  if(API.url)return;let bz=[];try{bz=JSON.parse(localStorage.getItem(K+'_buzon')||'[]')}catch(e){}
  if(!Array.isArray(bz)||!bz.length)return;try{localStorage.removeItem(K+'_buzon')}catch(e){}
  let n=0;bz.forEach(o=>{if(!o||!o.id||S.ordenes.some(x=>x.id===o.id))return;o.num=S.num++;S.ordenes.push(o);n++});
  if(!n)return;save();
  if(yo()&&U.role!=='cocina'){beep();toast(n===1?'Nuevo pedido web por aprobar':n+' pedidos web por aprobar')}
  const a=document.activeElement;if(!U.modal&&!(a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName)))render();else renderNav();
}
window.addEventListener('storage',e=>{if(e.key===K+'_buzon')recibirBuzon();if(e.key===K&&!API.url&&e.newValue){try{const n=JSON.parse(e.newValue);if(n&&n.v===1){S=n;render()}}catch(x){}}});

function renderNav(){
  const allowed=ROLES[U.role];
  const nuevas=S.comandas.filter(c=>c.estado==='nuevo').length;
  const cuentas=abiertas().filter(o=>o.cuentaPedida).length;
  const listos=S.comandas.filter(c=>c.estado==='listo').length;
  const cur=U.view==='pedido'?U.back:U.view;
  document.getElementById('nav').innerHTML=NAV.filter(([v])=>allowed.includes(v)).map(([v,n])=>{
    let b='';if(v==='cocina'&&nuevas)b=`<span class="badge warn">${nuevas}</span>`;if(v==='caja'&&cuentas)b=`<span class="badge warn">${cuentas}</span>`;if(v==='mesas'&&listos)b=`<span class="badge">${listos}</span>`;if(v==='pedidos'&&porAprobar().length)b=`<span class="badge warn">${porAprobar().length}</span>`;if(v==='reparto'&&paraSalir().length)b=`<span class="badge">${paraSalir().length}</span>`;

function pedidoEstado(o){const cs=cmdsOf(o);if(o.aprobacion==='pendiente')return 'aprobar';if(o.entrega==='en_camino')return 'camino';if(o.items.some(l=>!l.env&&l.est)||!cs.length)return 'cocina';return cs.every(c=>c.estado==='listo'||c.estado==='entregado')?'listo':'cocina'}

const urlBase=()=>(S.config.urlCliente||'https://street25tv.github.io/dateelgusto/cliente.html').trim();

function qrSVG(text,cell){

}

      <td>${st==='out'?'<span class="pill bad">Agotado</span>':st==='low'?'<span class="pill warn">Bajo</span>':'<span class="pill ok">Bien</span>'}</td><td><button class="btn sm" data-act="entrada" data-id="${i.id}">+ Entrada</button></td></tr>`}).join('')}
    </tbody></table></div>`;
  }
  return `<div class="bar">${tabs}<span class="muted small">Costo de insumos sugerido: por debajo del 35% del precio.</span></div>
  <div class="tbl-wrap"><table><thead><tr><th>Plato</th><th class="r">Precio</th><th class="r">Costo receta</th><th class="r">% costo</th><th class="r">Margen</th><th>Disponible</th></tr></thead><tbody>
  ${S.productos.map(p=>{const base=p.precio/(1+S.config.impoconsumo/100);const c=costoReceta(p);const pc=base?c/base*100:0;
    return `<tr><td><b>${esc(p.nombre)}</b><div class="ing">${p.receta.length?p.receta.map(([iid,q])=>{const i=S.insumos.find(x=>x.id===iid);return i?esc(i.nombre)+' '+fmtQty(q,i.unidad):''}).join(' · '):'Sin receta cargada'}</div></td>

/* ---------- REPORTES ---------- */
function vReportes(){
  const ps=pagadasTurno();const v=ps.reduce((a,o)=>a+o.pago.total,0);const pr=ps.reduce((a,o)=>a+o.pago.propina,0);
  const imp=ps.reduce((a,o)=>a+impo(o.pago.total).imp,0);
  // por hora
  const hb={};ps.forEach(o=>{const d=new Date(o.pago.t);d.setMinutes(0,0,0);hb[+d]=(hb[+d]||0)+o.pago.total});
  const hk=Object.keys(hb).map(Number).sort((a,b)=>a-b);const hmax=Math.max(1,...Object.values(hb));
  // platos
  const pl={};ps.forEach(o=>o.items.filter(l=>l.est).forEach(l=>{pl[l.nombre]=pl[l.nombre]||{c:0,v:0};pl[l.nombre].c+=l.cant;pl[l.nombre].v+=l.cant*l.precio}));
  const top=Object.entries(pl).sort((a,b)=>b[1].c-a[1].c).slice(0,7);const tmax=Math.max(1,...top.map(t=>t[1].c));
  const mt={};ps.forEach(o=>{mt[o.pago.metodo]=(mt[o.pago.metodo]||0)+o.pago.total});const mmax=Math.max(1,...Object.values(mt));
  const ms={};ps.forEach(o=>{const k=o.mesero||'—';ms[k]=ms[k]||{v:0,n:0,p:0};ms[k].v+=o.pago.total;ms[k].n++;ms[k].p+=o.pago.propina});
  const ef=ps.filter(o=>o.pago.metodo==='efectivo');const efV=ef.reduce((a,o)=>a+o.pago.total,0);const efP=ef.reduce((a,o)=>a+o.pago.propina,0);
  const esperado=S.config.base+efV+efP;
  const anul=S.ordenes.filter(o=>o.estado==='anulada'&&+o.anuladoEn>=S.turno).sort((a,b)=>b.anuladoEn-a.anuladoEn);const contado=+String(S.contado).replace(/\D/g,'');
  return `<div class="kpis">${kpi('Ventas del turno',money(v))}${kpi('Cuentas cobradas',ps.length)}${kpi('Ticket promedio',money(ps.length?v/ps.length:0))}${kpi('Propinas',money(pr))}${+S.config.impoconsumo?kpi('Impoconsumo',money(imp)):''}</div>
  <div class="rep">
    <section class="card"><h3>Ventas por hora</h3>
      ${hk.length?`<div class="hours">${hk.map(k=>`<div class="hbar ${hb[k]===hmax?'top':''}" title="${hhmm(k)}: ${money(hb[k])}"><small>${kmoney(hb[k])}</small><i style="height:${(hb[k]/hmax*100).toFixed(1)}%"></i></div>`).join('')}</div>
      <div class="hlab">${hk.map(k=>`<span>${new Date(k).toLocaleTimeString('es-CO',{hour:'numeric'})}</span>`).join('')}</div>`:'<p class="empty">Sin ventas todavía.</p>'}
    </section>
    <section class="card"><h3>Platos más vendidos</h3>
      ${top.map(([n,d])=>`<div class="hrow"><span>${esc(n)}</span><span class="tr"><i style="width:${d.c/tmax*100}%"></i></span><b>${d.c}</b></div>`).join('')||'<p class="empty">Sin datos.</p>'}
    </section>
    <section class="card"><h3>Medios de pago</h3>
      ${Object.entries(mt).sort((a,b)=>b[1]-a[1]).map(([k,x])=>`<div class="hrow"><span>${MET[k]}</span><span class="tr"><i style="width:${x/mmax*100}%"></i></span><b>${money(x)}</b></div>`).join('')||'<p class="empty">Sin datos.</p>'}
      <h3 style="margin-top:8px">Por mesero</h3>
      <div class="tbl-wrap"><table style="min-width:0"><thead><tr><th>Mesero</th><th class="r">Cuentas</th><th class="r">Ventas</th><th class="r">Propinas</th></tr></thead><tbody>
      ${Object.entries(ms).sort((a,b)=>b[1].v-a[1].v).map(([k,d])=>`<tr><td>${esc(k)}</td><td class="r">${d.n}</td><td class="r">${money(d.v)}</td><td class="r">${money(d.p)}</td></tr>`).join('')}
      </tbody></table></div>
    </section>
    <section class="card"><div class="bar"><h3>Anulaciones del turno</h3><span class="count">${anul.length}</span></div>
      ${anul.length?anul.map(o=>`<div class="pay-row"><span><b>${esc(label(o))} · ${money(total(o))}</b><span class="muted small">${hhmm(o.anuladoEn)} · ${esc(o.motivoAnulacion||'Sin motivo')}</span><span class="small">Anuló ${esc(o.anuladoPor||'—')}${o.autorizadoPor&&o.autorizadoPor!==o.anuladoPor?' · autorizó '+esc(o.autorizadoPor):''}</span></span></div>`).join(''):'<p class="empty">Ninguna anulación en este turno.</p>'}
    </section>
    <section class="card"><h3>Cierre de caja</h3>
      <div class="cierre">
        <div><span class="muted">Base inicial</span><span>${money(S.config.base)}</span></div>
        <div><span class="muted">Ventas en efectivo</span><span>${money(efV)}</span></div>
        <div><span class="muted">Propinas en efectivo</span><span>${money(efP)}</span></div>
        <div class="tot"><span>Efectivo esperado</span><span>${money(esperado)}</span></div>
      </div>
      <label class="field"><span>Efectivo contado en caja</span><input id="contado" inputmode="numeric" placeholder="Ej. 850000" value="${esc(S.contado)}"></label>
      <div id="dif">${difHTML(esperado,contado)}</div>
      <button class="btn dark" data-act="cerrarTurno">Cerrar turno</button>
    </section>
  </div>`;
}
function difHTML(esp,cont){if(!cont)return '<span class="muted small">Escribe lo que contaste para ver la diferencia.</span>';const d=cont-esp;return d===0?'<span class="pill ok">Cuadra exacto</span>':`<span class="pill ${d>0?'info':'bad'}">${d>0?'Sobran':'Faltan'} ${money(Math.abs(d))}</span>`}

  let h='';

    h=`${head('Nota para cocina')}<p class="muted">${esc(l.nombre)}</p><form data-form="nota" class="panel"><textarea name="nota" id="notaTxt" rows="3" class="field" style="background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px">${esc(l.nota)}</textarea>

    <button class="btn primary">Guardar nota</button></form>`}
  if(M.type==='cobro'){const o=ord(M.oid);if(!o){U.modal=null;return renderModal()}
    const t=total(o);const {base,imp}=impo(t);const prop=Math.round(t*M.prop/100/100)*100;const pagar=t+prop;
    const rec=+String(M.recibido||'').replace(/\D/g,'');
    h=`${head('Cobrar · '+esc(label(o)))}
    <div class="small muted">${o.items.map(l=>l.cant+'× '+esc(l.nombre)).join(' · ')}</div>
    <div class="paybox">${+S.config.impoconsumo?`<div><span class="muted">Base</span><span>${money(base)}</span></div><div><span class="muted">Impoconsumo ${S.config.impoconsumo}%</span><span>${money(imp)}</span></div>`:''}<div><span>Consumo</span><span>${money(t)}</span></div>
      <div style="align-items:center"><span>Propina voluntaria</span><span class="seg">${[0,5,10,15].map(p=>`<button class="${M.prop===p?'on':''}" data-act="prop" data-id="${p}">${p}%</button>`).join('')}</span></div>
      ${prop?`<div><span class="muted">Propina</span><span>${money(prop)}</span></div>`:''}
      <div class="grand"><span>Total a pagar</span><span>${money(pagar)}</span></div></div>
    <div class="methods">${Object.keys(MET).map(k=>`<button class="${M.metodo===k?'on':''}" data-act="metodo" data-id="${k}"><i style="background:${METC[k]}">${MET[k][0]}</i>${MET[k]}</button>`).join('')}</div>
    ${M.metodo==='efectivo'?`<label class="field"><span>Efectivo recibido</span><input id="recibido" inputmode="numeric" placeholder="${pagar}" value="${esc(M.recibido||'')}"></label>
      <div class="row">${[['Exacto',pagar],['$50.000',50000],['$100.000',100000]].map(([n,v])=>`<button class="btn sm" data-act="billete" data-id="${v}">${n}</button>`).join('')}</div>
      <div id="cambio">${cambioHTML(rec,pagar)}</div>`
    :`<label class="field"><span>${M.metodo==='tarjeta'?'Número de aprobación del datáfono':'Referencia del comprobante'}</span><input id="ref" value="${esc(M.ref||'')}" placeholder="Opcional"></label>
      ${M.metodo!=='tarjeta'?'<p class="small muted">En la fase de pagos el comprobante se verificará solo con IA, como en tu tienda.</p>':''}`}

  if(M.type==='precuenta'){const o=ord(M.oid);const t=total(o);const {base,imp}=impo(t);
    h=`${head('Precuenta')}<div class="paper"><div class="c big">${esc(S.config.nombre)}</div><div class="c">NIT ${esc(S.config.nit)}</div><div class="c">${esc(S.config.direccion)}</div><hr>
    <div class="r"><span>${esc(label(o))}</span><span>Pedido ${o.num}</span></div><div class="r"><span>Mesero: ${esc(o.mesero)}</span><span>${hhmm(now())}</span></div><hr>
    ${o.items.map(l=>`<div class="r"><span>${l.cant} ${esc(l.nombre)}</span><span>${money(l.precio*l.cant)}</span></div>`).join('')}<hr>
    ${+S.config.impoconsumo?`<div class="r"><span>Base</span><span>${money(base)}</span></div><div class="r"><span>Impoconsumo ${S.config.impoconsumo}%</span><span>${money(imp)}</span></div>`:''}
    <div class="r big"><span>TOTAL</span><span>${money(t)}</span></div><hr>
    ${+S.config.propina?`<div class="r"><span>Propina sugerida ${S.config.propina}%</span><span>${money(t*S.config.propina/100)}</span></div>
    <div class="c" style="font-size:.74rem">La propina es voluntaria. Puede aceptarla, modificarla o rechazarla.</div>`:''}<div class="c" style="font-size:.74rem">Documento no válido como factura</div></div>
    <button class="btn" disabled>Imprimir por Bluetooth · se activa en la fase final</button>`}
  if(M.type==='nuevoPedido'){
    h=`${head('Nuevo pedido')}<form data-form="pedido" class="panel">
      <div class="radio"><label><input type="radio" name="tipo" value="domicilio" checked> Domicilio</label><label><input type="radio" name="tipo" value="llevar"> Para llevar</label></div>
      <div class="grid2"><label class="field"><span>Cliente</span><input name="cliente" required placeholder="Nombre"></label><label class="field"><span>Teléfono</span><input name="tel" inputmode="tel" placeholder="300 000 0000"></label></div>
      <label class="field"><span>Canal</span><select name="canal">${['WhatsApp','Teléfono','Mostrador','Instagram','Rappi','DiDi Food'].map(x=>`<option>${x}</option>`).join('')}</select></label>
      <div class="only-dom panel"><label class="field"><span>Dirección</span><input name="direccion" placeholder="Calle, número, apto, barrio"></label>
        <label class="field"><span>Zona de entrega</span><select name="zona">${S.config.zonas.map((z,i)=>`<option value="${i}">${esc(z.n)} · ${money(z.c)}</option>`).join('')}</select></label></div>
      <button class="btn primary big">Crear y agregar productos</button></form>`}
  if(M.type==='reserva'){const d=new Date(now()+2*60*MIN);const ds=d.toLocaleDateString('en-CA');
    h=`${head('Nueva reserva')}<form data-form="reserva" class="panel">
      <div class="grid2"><label class="field"><span>Nombre</span><input name="nombre" required></label><label class="field"><span>Teléfono / WhatsApp</span><input name="tel" inputmode="tel"></label></div>
      <div class="grid2"><label class="field"><span>Fecha</span><input name="fecha" type="date" value="${ds}" required></label><label class="field"><span>Hora</span><input name="hora" type="time" value="20:00" required></label></div>
      <div class="grid2"><label class="field"><span>Personas</span><input name="personas" type="number" min="1" value="2" required></label><label class="field"><span>Mesa</span><select name="mesa"><option value="">Asignar al llegar</option>${S.mesas.map(m=>`<option value="${m.id}">Mesa ${esc(m.nombre)} · ${m.sillas}p</option>`).join('')}</select></label></div>
      <label class="field"><span>Nota</span><input name="nota" placeholder="Cumpleaños, silla para bebé…"></label>
      <button class="btn primary big">Guardar reserva</button></form>`}
  if(M.type==='msg'){const r=S.reservas.find(x=>x.id===M.rid);
    const txt=`Hola ${r.nombre}, te esperamos el ${new Date(r.t).toLocaleDateString('es-CO',{weekday:'long',day:'numeric',month:'long'})} a las ${hhmm(r.t)} en ${S.config.nombre} (${r.personas} personas). ¿Confirmas? Responde SÍ o NO.`;
    h=`${head('Recordatorio por WhatsApp')}<p class="muted small">Para ${esc(r.tel||'el cliente')}. En la fase de automatización se envía solo 2 horas antes.</p><div class="msg" id="msgTxt">${esc(txt)}</div><button class="btn primary" data-act="copiar">Copiar mensaje</button>`}
  if(M.type==='entrada'){const i=S.insumos.find(x=>x.id===M.iid);
    h=`${head('Entrada de inventario')}<p class="muted">${esc(i.nombre)} · hay ${fmtQty(i.stock,i.unidad)}</p><form data-form="entrada" class="panel">
      <label class="field"><span>Cantidad que llegó (${i.unidad})</span><input name="q" type="number" min="0" step="any" required inputmode="decimal" placeholder="${i.unidad==='und'?'12':'5000'}"></label>
      <button class="btn primary big">Sumar al inventario</button></form>`}
  if(M.type==='anular'){const o=ord(M.oid);const u=yo();
    h=`${head('Anular pedido')}<p class="muted">${esc(label(o))} · ${money(total(o))}. Las comandas salen de cocina y la anulación queda en el reporte con tu nombre.</p>
    <form data-form="anular" class="panel"><label class="field"><span>Motivo</span><input name="motivo" id="motivoTxt" required placeholder="Escribe o elige un motivo"></label>
    <div class="chips">${['Error al tomar el pedido','Cliente se fue','Cliente cambió de opinión','Plato con problema','Cortesía de la casa'].map(x=>`<button type="button" class="chip" data-act="motivoChip" data-id="${x}">${x}</button>`).join('')}</div>
    ${u&&!['admin','caja'].includes(u.rol)?'<p class="small muted">Después te pedirá el PIN de un administrador o de caja para autorizar.</p>':''}
    <button class="btn dark big">Continuar</button></form>`}
  if(M.type==='comprobante'){const o=ord(M.oid);if(!o){U.modal=null;return renderModal()}const src=CMP[o.id];
    h=`${head('Comprobante · pedido '+o.num)}<div class="cmp">${src&&src.startsWith('data:')?`<img class="cmp-img" src="${src}" alt="Captura del pago de ${esc(o.cliente)}">`:`<p class="empty">${src==='x'?'Este pedido no tiene comprobante guardado.':'Cargando comprobante…'}</p>`}</div>
    <div class="pay-row"><span>${esc(o.cliente)} · ${MET[o.pagoPreferido]||'Transferencia'}</span><b>${money(total(o))}</b></div>
    <p class="small muted">Revisa que el valor, la fecha y la cuenta de destino coincidan antes de aprobar.</p>
    ${o.aprobacion==='pendiente'&&puedeAprobar()?`<div class="row"><button class="btn danger" data-act="rechazar" data-id="${o.id}">Rechazar</button><button class="btn primary" data-act="aprobar" data-id="${o.id}">Aprobar y enviar a cocina</button></div>`:''}`}
  if(M.type==='rechazo'){const o=ord(M.oid);
    h=`${head('Rechazar pedido '+(o?o.num:''))}<p class="muted">El cliente ve este motivo en su seguimiento. El pedido no pasa a cocina.</p>
    <form data-form="rechazo" class="panel"><label class="field"><span>Motivo</span><input name="motivo" id="rechazoTxt" required placeholder="Escribe o elige un motivo"></label>
    <div class="chips">${['No nos llegó el pago','El valor no coincide con el pedido','No se ve bien el comprobante','No llegamos a esa dirección','Se agotó un producto'].map(x=>`<button type="button" class="chip" data-act="rechazoChip" data-id="${x}">${x}</button>`).join('')}</div>
    <button class="btn dark big">Rechazar pedido</button></form>`}
  if(M.type==='auth'){h=`${head('Autoriza la anulación')}<p class="muted">Un administrador o la caja escribe su PIN para anular ${esc(label(ord(M.oid)))}.<br>Motivo: ${esc(M.motivo)}</p>${padHTML(M.pin,'authKey',M.err)}`}
  if(M.type==='pinUser'){const u=S.usuarios.find(x=>x.id===M.uid);
    h=`${head('Nuevo PIN para '+esc(u.nombre))}<form data-form="pinUser" class="panel"><label class="field"><span>PIN de 4 números</span><input name="pin" inputmode="numeric" maxlength="4" pattern="\\d{4}" required autocomplete="off"></label><button class="btn primary big">Guardar PIN</button></form>`}
  if(M.type==='qrs'){h=`${head('QR de todas las mesas')}<p class="muted small noprint">Imprime esta hoja, recorta cada código y pégalo en su mesa. En tu página publicada el botón abre la impresión del navegador.</p>
    <div class="qr-sheet">${S.mesas.map(m=>`<div class="qr-cell"><b>Mesa ${esc(m.nombre)}</b><div data-qr="${m.id}"></div><span>Escanea para ver la carta y pedir</span></div>`).join('')}</div>
    <button class="btn primary noprint" data-act="imprimirQR">Imprimir</button>`}
  if(M.type==='confirm'){h=`${head(esc(M.title))}<p>${esc(M.text)}</p><div class="row"><button class="btn" data-act="close">Cancelar</button><button class="btn ${M.danger?'dark':'primary'}" data-act="confirmOk">${esc(M.ok)}</button></div>`}
  el.innerHTML=`<div class="mbox ${M.type==='cobro'||M.type==='qrs'||M.type==='comprobante'?'wide':''}" role="dialog" aria-modal="true">${h}</div>`;
  if(M.type==='qrs')drawQR();
}
function cambioHTML(rec,pagar){if(!rec)return '<span class="muted small">Sin valor, se registra como pago exacto.</span>';if(rec<pagar)return `<span class="pill bad">Faltan ${money(pagar-rec)}</span>`;return `<span class="muted">Cambio para el cliente</span> <span class="cambio">${money(rec-pagar)}</span>`}
const confirmar=(title,text,ok,fn,danger)=>{U.modal={type:'confirm',title,text,ok,fn,danger};renderModal()};

/* ---------- eventos ---------- */
const ACT={
  nav:id=>{U.view=id;U.active=null;U.q='';render();document.querySelector('.main').scrollTop=0},
  zona:id=>{U.zona=id;render()},
  mesa:id=>{let o=ordenMesa(id);if(!o){o=nuevaOrden({tipo:'mesa',mesaId:id,mesero:defMesero()});save()}
    else{let ch=false;if(o.llamado){o.llamado=null;ch=true}if(o.mesero==='QR'&&yo()?.rol==='mesero'){o.mesero=yo().nombre;ch=true}if(ch)save()}
    U.active=o.id;U.back='mesas';U.view='pedido';U.cat='all';U.q='';render();document.querySelector('.main').scrollTop=0},
  cat:id=>{U.cat=id;render()},
  add:id=>{const o=ord(U.active);addItem(o,id);save();render()},
  inc:id=>{const l=ord(U.active).items.find(x=>x.id===id);l.cant++;save();render()},
  dec:id=>{const o=ord(U.active);const l=o.items.find(x=>x.id===id);l.cant--;if(l.cant<=0)o.items=o.items.filter(x=>x!==l);save();render()},
  nota:id=>{U.modal={type:'nota',lid:id};renderModal();setTimeout(()=>document.getElementById('notaTxt')?.focus(),30)},
  notaChip:(id)=>{const t=document.getElementById('notaTxt');t.value=t.value?t.value.replace(/\s*$/,'')+', '+id:id},
  enviar:()=>{const o=ord(U.active);const n=enviarCocina(o);save();render();if(n&&n.length)toast('Comanda '+n.map(x=>'#'+x).join(' y ')+' enviada');else toast('Productos registrados')},
  enviarPedido:id=>{const n=enviarCocina(ord(id));save();render();if(n.length)toast('Comanda '+n.map(x=>'#'+x).join(' y ')+' enviada')},
  precuenta:()=>{U.modal={type:'precuenta',oid:U.active};renderModal()},
  pedirCuenta:()=>{const o=ord(U.active);o.cuentaPedida=!o.cuentaPedida;save();render()},
  back:()=>{U.view=U.back;U.active=null;U.q='';render()},
  toTicket:()=>document.getElementById('ticket')?.scrollIntoView({behavior:'smooth'}),
  anularOrden:()=>{const o=ord(U.active);if(!o.items.length){S.ordenes=S.ordenes.filter(x=>x!==o);save();ACT.back();return}
    if(!o.items.some(l=>l.env)){S.ordenes=S.ordenes.filter(x=>x!==o);save();ACT.back();toast('Pedido descartado: no se había enviado nada');return}
    U.modal={type:'anular',oid:o.id};renderModal()},
  motivoChip:id=>{const t=document.getElementById('motivoTxt');if(t)t.value=id},
  localGps:()=>{if(!navigator.geolocation){toast('Este equipo no da la ubicación','bad');return}toast('Tomando la ubicación… quédate en el local');
    navigator.geolocation.getCurrentPosition(p=>{S.config.local={lat:+p.coords.latitude.toFixed(6),lng:+p.coords.longitude.toFixed(6)};save();render();toast('Ubicación del local guardada (precisión '+Math.round(p.coords.accuracy)+' m)')},
      ()=>toast('No se pudo tomar la ubicación. Revisa el permiso del navegador.','bad'),{enableHighAccuracy:true,timeout:20000,maximumAge:0})},
  localTxt:()=>{const v=(document.getElementById('localTxt')?.value||'');const m=v.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/)||v.match(/(-?\d{1,2}\.\d+)\s*,\s*(-?\d{1,3}\.\d+)/);
    if(!m){toast('No encontré coordenadas. Pega un enlace de Google Maps que tenga @lat,lng o escribe "10.98, -74.78"','bad');return}
    S.config.local={lat:+(+m[1]).toFixed(6),lng:+(+m[2]).toFixed(6)};save();render();toast('Ubicación del local guardada')},
  tramoAdd:()=>{const t=S.config.tramos;const u=t[t.length-1]||{km:0,c:0};t.push({km:u.km+2,c:u.c+2000});save();render()},
  tramoDel:id=>{if(S.config.tramos.length<=1){toast('Debe quedar al menos un tramo','bad');return}S.config.tramos.splice(+id,1);save();render()},
  opcAdd:()=>{S.config.opciones.push({n:'Nuevo grupo',items:[],cats:[]});save();render()},
  opcDel:id=>{S.config.opciones.splice(+id,1);save();render()},
  rechazoChip:id=>{const t=document.getElementById('rechazoTxt');if(t)t.value=id},
  authKey:k=>pinDigito(k,U.modal,h=>{const a=S.usuarios.find(u=>u.activo&&['admin','caja'].includes(u.rol)&&u.pinHash===h);
    if(!a){U.modal.pin='';U.modal.err=true;renderModal();toast('Ese PIN no es de administrador ni de caja','bad');return}
    const M=U.modal;anularOrden(M.oid,M.motivo,a.nombre)}).then(()=>{if(U.modal&&U.modal.type==='auth')renderModal()}),
  lockSel:id=>{LOCK.sel=id;LOCK.pin='';LOCK.err=false;renderLock()},
  lockBack:()=>{LOCK.sel=null;LOCK.pin='';renderLock()},
  lockKey:k=>pinDigito(k,LOCK,h=>{const u=S.usuarios.find(x=>x.id===LOCK.sel);
    if(!u||u.pinHash!==h){LOCK.pin='';LOCK.err=true;renderLock();return}
    SES=u.id;try{localStorage.setItem('fogon_ses',SES)}catch(e){}LOCK.sel=null;LOCK.pin='';lastAct=now();
    U.role=u.rol;U.active=null;U.view=VISTA_URL&&ROLES[u.rol].includes(VISTA_URL)?VISTA_URL:ROLES[u.rol][0];render();pantallaEncendida();toast('Hola, '+u.nombre)}).then(()=>{if(!yo())renderLock()}),
  bloquear:()=>{SES=null;try{localStorage.removeItem('fogon_ses')}catch(e){}U.active=null;LOCK.sel=null;LOCK.pin='';render()},
  pinUser:id=>{U.modal={type:'pinUser',uid:id};renderModal()},
  toggleUser:id=>{const u=S.usuarios.find(x=>x.id===id);
    if(u.id===SES){toast('No puedes desactivarte a ti mismo','bad');return}
    if(u.activo&&u.rol==='admin'&&S.usuarios.filter(x=>x.activo&&x.rol==='admin').length<=1){toast('Debe quedar al menos un administrador activo','bad');return}
    u.activo=!u.activo;syncMeseros();save();render();toast(u.nombre+(u.activo?' activado':' desactivado'))},
  kds:id=>{U.kds=id;render()},
  bump:id=>{const c=S.comandas.find(x=>x.id===id);const nx={nuevo:'prep',prep:'listo',listo:'entregado'}[c.estado];c.estado=nx;if(nx==='listo')c.tListo=now();save();render();
    if(nx==='listo'){const o=ord(c.ordenId);toast((o?label(o):'Comanda')+' lista para servir')}},
  cobrar:id=>{const o=ord(id||U.active);if(!o.items.length){toast('La cuenta no tiene productos','bad');return}
    U.modal={type:'cobro',oid:o.id,metodo:MET[o.pagoPreferido]?o.pagoPreferido:'efectivo',prop:o.tipo==='mesa'?S.config.propina:0,recibido:o.pagaCon?String(o.pagaCon):'',ref:'',split:1};renderModal()},
  prop:id=>{U.modal.prop=+id;renderModal()},
  metodo:id=>{U.modal.metodo=id;renderModal()},
  billete:id=>{U.modal.recibido=String(id);renderModal()},
  split:id=>{U.modal.split=Math.max(1,Math.min(20,U.modal.split+ +id));renderModal()},
  pagar:()=>{const M=U.modal;const o=ord(M.oid);const t=total(o);const prop=Math.round(t*M.prop/100/100)*100;const pagar=t+prop;
    const rec=+String(M.recibido||'').replace(/\D/g,'');
    if(M.metodo==='efectivo'&&rec&&rec<pagar){toast('El efectivo recibido es menor al total','bad');return}
    const pend=o.items.filter(l=>!l.env);if(pend.length)enviarCocina(o);
    o.estado='pagada';o.cuentaPedida=false;o.cobradoPor=yo()?.nombre||'';o.pago={metodo:M.metodo,total:t,propina:prop,t:now(),recibido:rec||pagar,ref:M.ref||''};
    if(o.tipo==='mesa'){cerrarComandas(o);o.entrega='entregado'}
    save();U.modal=null;if(U.view==='pedido'&&U.active===o.id){U.view=U.back;U.active=null}
    render();toast('Cobrado '+money(pagar)+' · '+MET[M.metodo]+(M.metodo==='efectivo'&&rec>pagar?' · cambio '+money(rec-pagar):''))},
  openOrden:id=>{U.active=id;U.back=U.view==='pedido'?U.back:U.view;U.view='pedido';U.cat='all';U.q='';render()},
  nuevoPedido:()=>{U.modal={type:'nuevoPedido'};renderModal()},
  aprobar:id=>{const o=ord(id);const u=yo();if(!o)return;if(!puedeAprobar()){toast('Solo caja o el administrador aprueban pagos','bad');return}
    o.aprobacion='aprobado';o.aprobadoPor=u.nombre;o.tAprobado=now();
    const n=enviarCocina(o);S.comandas.filter(c=>n.includes(c.num)).forEach(c=>c.origen='web');
    o.estado='pagada';o.cobradoPor=u.nombre;o.pago={metodo:o.pagoPreferido||'nequi',total:total(o),propina:0,t:now(),recibido:total(o),ref:'Comprobante web'};
    save();U.modal=null;render();toast('Pago aprobado · pedido '+o.num+' en cocina')},
  rechazar:id=>{if(!puedeAprobar()){toast('Solo caja o el administrador rechazan pagos','bad');return}U.modal={type:'rechazo',oid:id};renderModal()},
  verComprobante:id=>{const o=ord(id);if(!o)return;U.modal={type:'comprobante',oid:id};renderModal();cargarComprobante(o)},
  salir:id=>{const o=ord(id);const u=yo();if(!o)return;o.entrega='en_camino';o.tSalida=now();o.domiciliario=u?u.nombre:'';cerrarComandas(o);save();render();toast('Vas con el pedido '+o.num+' · '+(o.cliente||''))},
  despachar:id=>{const o=ord(id);o.entrega='en_camino';o.tSalida=now();o.domiciliario=o.domiciliario||yo()?.nombre||'';cerrarComandas(o);save();render();toast('Pedido de '+(o.cliente||'cliente')+' en camino')},
  entregarPedido:id=>{const o=ord(id);o.entrega='entregado';o.tEntrega=now();if(!o.domiciliario&&o.tipo==='domicilio')o.domiciliario=yo()?.nombre||'';cerrarComandas(o);save();
    if(o.estado!=='pagada'){render();ACT.cobrar(id);toast('Entregado. Registra el pago.')}else{render();toast('Pedido entregado')}},
  qrCat:id=>{U.qrCat=id;render()},
  qrAdd:id=>{const l=U.qrCart.find(x=>x.pid===id);if(l)l.cant++;else U.qrCart.push({pid:id,cant:1});render()},
  qrDec:id=>{const l=U.qrCart.find(x=>x.pid===id);if(!l)return;l.cant--;if(l.cant<=0)U.qrCart=U.qrCart.filter(x=>x!==l);render()},
  qrEnviar:()=>{let o=ordenMesa(U.qrMesa);if(!o)o=nuevaOrden({tipo:'mesa',mesaId:U.qrMesa,mesero:'QR',canal:'Carta QR'});
    U.qrCart.forEach(l=>addItem(o,l.pid,l.cant));const n=enviarCocina(o);S.comandas.filter(c=>n.includes(c.num)).forEach(c=>c.origen='qr');U.qrCart=[];save();render();toast('Pedido de la mesa '+mesaById(U.qrMesa).nombre+' enviado a cocina'+(n.length?' (#'+n.join(', #')+')':''))},
  qrCuenta:()=>{const o=ordenMesa(U.qrMesa);if(!o){toast('Esta mesa no tiene cuenta abierta','bad');return}o.cuentaPedida=true;save();render();toast('Caja y mesero ven que la mesa '+mesaById(U.qrMesa).nombre+' pidió la cuenta')},
  qrMesero:()=>{let o=ordenMesa(U.qrMesa);if(!o)o=nuevaOrden({tipo:'mesa',mesaId:U.qrMesa,mesero:'QR',canal:'Carta QR'});o.llamado=now();save();render();toast('La mesa '+mesaById(U.qrMesa).nombre+' llama al mesero')},
  instalar:async()=>{if(!INSTALAR)return;INSTALAR.prompt();try{await INSTALAR.userChoice}catch(e){}INSTALAR=null;render()},
  qrTodas:()=>{U.modal={type:'qrs'};renderModal()},
  imprimirQR:()=>{try{window.print()}catch(e){}},
  copiarLink:id=>{const t=document.getElementById(id)?.textContent||'';try{navigator.clipboard.writeText(t).then(()=>toast('Enlace copiado'),()=>toast('Selecciónalo y cópialo'))}catch(e){toast('Selecciónalo y cópialo')}},
  resF:id=>{U.resF=id;render()},
  nuevaReserva:()=>{U.modal={type:'reserva'};renderModal()},
  resConf:id=>{S.reservas.find(r=>r.id===id).estado='confirmada';save();render();toast('Reserva confirmada')},
  resNo:id=>{S.reservas.find(r=>r.id===id).estado='no_show';save();render()},
  resMsg:id=>{U.modal={type:'msg',rid:id};renderModal()},
  resSentar:id=>{const r=S.reservas.find(x=>x.id===id);
    if(!r.mesaId){toast('Asigna una mesa a la reserva primero','bad');return}
    if(ordenMesa(r.mesaId)){toast('La mesa '+mesaById(r.mesaId).nombre+' está ocupada','bad');return}
    r.estado='llego';const o=nuevaOrden({tipo:'mesa',mesaId:r.mesaId,mesero:defMesero(),cliente:r.nombre});save();U.active=o.id;U.back='reservas';U.view='pedido';render()},
  copiar:()=>{const t=document.getElementById('msgTxt').textContent;const ok=()=>toast('Mensaje copiado');
    try{navigator.clipboard.writeText(t).then(ok,()=>{selectText();toast('Selecciónalo y cópialo')})}catch(e){selectText();toast('Selecciónalo y cópialo')}},
  invTab:id=>{U.invTab=id;render()},
  entrada:id=>{U.modal={type:'entrada',iid:id};renderModal()},
  disp:id=>{const p=prod(id);p.disp=!p.disp;save();render();toast(p.nombre+(p.disp?' disponible':' marcado como agotado'))},
  cerrarTurno:()=>confirmar('Cerrar turno','Los reportes y la caja empiezan en cero desde ahora. Las cuentas abiertas siguen abiertas.','Cerrar turno',()=>{S.turno=now();S.contado='';save();U.modal=null;render();toast('Turno cerrado')},true),
  addMesa:z=>{const n=S.mesas.filter(m=>m.zona===z).length+1;const pre=z==='Terraza'?'T':z==='Salón'?'':z[0].toUpperCase();let nombre=pre+n;while(S.mesas.some(m=>m.nombre===nombre))nombre=pre+(+String(nombre).replace(/\D/g,'')+1);
    S.mesas.push({id:uid('m'),nombre,zona:z,sillas:4});save();render()},
  delMesa:id=>{if(ordenMesa(id)){toast('No se puede quitar una mesa con cuenta abierta','bad');return}S.mesas=S.mesas.filter(m=>m.id!==id);save();render()},
  delMesero:n=>{if(S.meseros.length<=1){toast('Debe quedar al menos un mesero','bad');return}S.meseros=S.meseros.filter(x=>x!==n);save();render()},
  sincronizar:()=>{VER=null;cambios()?flush():poll();toast('Sincronizando…')},
  desconectar:()=>confirmar('Desconectar este equipo','Este equipo vuelve al modo demo. Los datos de la hoja no se tocan; puedes volver a conectar cuando quieras.','Desconectar',()=>{
    API={url:'',token:''};try{localStorage.removeItem('fogon_api')}catch(e){}MOVS=[];SNAP=null;VER=null;S=seed();save();setNet('demo');U.modal=null;render();toast('Equipo en modo demo')},true),
  reset:()=>API.url?toast('Estás conectado a tu hoja. Desconecta este equipo para borrarlo.','bad'):confirmar('Empezar de cero','Se borran ventas, comandas, reservas, usuarios y cambios a la carta hechos en este equipo. Queda solo el Administrador (PIN 1234).','Borrar todo',()=>{S=seed();save();U.modal=null;U.view=ROLES[U.role][0];U.active=null;U.qrCart=[];render();toast('Listo: el sistema quedó en cero')},true),
  close:()=>{U.modal=null;renderModal()},
  confirmOk:()=>{U.modal?.fn?.()}
};
function anularOrden(oid,motivo,autorizo){
  const o=ord(oid);const u=yo();o.estado='anulada';o.anuladoPor=u?.nombre||'';o.autorizadoPor=autorizo||o.anuladoPor;o.motivoAnulacion=motivo;o.anuladoEn=now();
  cerrarComandas(o);save();U.modal=null;if(U.view==='pedido'){U.view=U.back;U.active=null}render();toast('Pedido anulado · queda en el reporte')
}
function selectText(){const el=document.getElementById('msgTxt');const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r)}
const FORMS={
  rechazo:fd=>{const o=ord(U.modal.oid);const u=yo();const motivo=String(fd.get('motivo')||'').trim();if(!o)return;if(!motivo){toast('Escribe el motivo para el cliente','bad');return}
    o.aprobacion='rechazado';o.motivoRechazo=motivo;o.estado='anulada';o.anuladoPor=u?.nombre||'';o.autorizadoPor=u?.nombre||'';o.motivoAnulacion='Pago rechazado: '+motivo;o.anuladoEn=now();
    save();U.modal=null;render();toast('Pedido '+o.num+' rechazado · el cliente ve el motivo')},
  nota:fd=>{const l=ord(U.active).items.find(x=>x.id===U.modal.lid);l.nota=String(fd.get('nota')).trim();U.modal=null;save();render()},
  pedido:fd=>{const tipo=fd.get('tipo');const z=S.config.zonas[+fd.get('zona')||0];
    if(tipo==='domicilio'&&!String(fd.get('direccion')).trim()){toast('Escribe la dirección de entrega','bad');return}
    const o=nuevaOrden({tipo,cliente:String(fd.get('cliente')).trim(),tel:String(fd.get('tel')).trim(),canal:fd.get('canal'),direccion:tipo==='domicilio'?String(fd.get('direccion')).trim():'',zona:tipo==='domicilio'?z.n:'',mesero:defMesero()});
    if(tipo==='domicilio')o.items.push({id:uid('l'),pid:'envio',nombre:'Domicilio '+z.n.split(' · ')[0],precio:z.c,cant:1,nota:'',env:true,est:null});
    save();U.modal=null;U.active=o.id;U.back='pedidos';U.view='pedido';U.cat='all';render()},
  reserva:fd=>{const [y,mo,d]=String(fd.get('fecha')).split('-').map(Number);const [hh,mm]=String(fd.get('hora')).split(':').map(Number);
    S.reservas.push({id:uid('r'),nombre:String(fd.get('nombre')).trim(),tel:String(fd.get('tel')).trim(),personas:+fd.get('personas')||2,t:+new Date(y,mo-1,d,hh,mm),mesaId:fd.get('mesa')||null,estado:'pendiente',nota:String(fd.get('nota')).trim()});
    save();U.modal=null;render();toast('Reserva guardada')},
  entrada:fd=>{const i=S.insumos.find(x=>x.id===U.modal.iid);const q=+fd.get('q');if(!(q>0))return;i.stock=Math.max(0,i.stock)+q;if(API.url)MOVS.push({insumo:i.id,cantidad:q,motivo:'Entrada',ref:'Compra registrada en la app',t:now()});save();U.modal=null;render();toast(i.nombre+': +'+fmtQty(q,i.unidad))},
  anular:fd=>{const motivo=String(fd.get('motivo')||'').trim();if(!motivo){toast('Escribe el motivo de la anulación','bad');return}
    const u=yo();if(u&&['admin','caja'].includes(u.rol)){anularOrden(U.modal.oid,motivo,u.nombre);return}
    U.modal={type:'auth',oid:U.modal.oid,motivo,pin:'',err:false};renderModal()},
  usuario:async fd=>{const nombre=String(fd.get('nombre')).trim(),rol=fd.get('rol'),pin=String(fd.get('pin')).trim();
    if(!/^\d{4}$/.test(pin)){toast('El PIN debe tener 4 números','bad');return}
    if(S.usuarios.some(u=>u.nombre.toLowerCase()===nombre.toLowerCase())){toast('Ya existe alguien con ese nombre','bad');return}
    S.usuarios.push({id:uid('u'),nombre,rol,pinHash:await sha(pin),activo:true});syncMeseros();save();render();toast(nombre+' agregado como '+ROL_N[rol].toLowerCase())},
  pinUser:async fd=>{const pin=String(fd.get('pin')).trim();if(!/^\d{4}$/.test(pin)){toast('El PIN debe tener 4 números','bad');return}
    const u=S.usuarios.find(x=>x.id===U.modal.uid);u.pinHash=await sha(pin);U.modal=null;save();render();toast('PIN de '+u.nombre+' actualizado')},
  conectar:async fd=>{
    const url=String(fd.get('url')).trim(),token=String(fd.get('token')).trim();
    if(!/^https:\/\/script\.google(usercontent)?\.com\//.test(url)){toast('La URL debe ser la de Apps Script y terminar en /exec','bad');return}
    toast('Conectando…');
    try{const r=await fetch(url+'?action=state&token='+encodeURIComponent(token));const j=await r.json();if(!j.ok)throw new Error(j.error||'Respuesta inválida');
      API={url,token};try{localStorage.setItem('fogon_api',JSON.stringify(API))}catch(e){}
      MOVS=[];SNAP=null;NET='';setNet('ok');aplicar(j.state);toast('Conectado a '+(j.state.config.nombre||'tu hoja'));
    }catch(e){toast('No se pudo conectar: '+(e.message&&e.message!=='Failed to fetch'?e.message:'revisa la URL, la clave y que la app esté publicada para cualquier usuario'),'bad')}
  },
  mesero:fd=>{const n=String(fd.get('n')).trim();if(!n)return;if(S.meseros.includes(n)){toast('Ese mesero ya existe','bad');return}S.meseros.push(n);save();render()}
};
document.addEventListener('click',e=>{
  if(e.target.id==='modal'){U.modal=null;renderModal();return}
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  const fn=ACT[b.dataset.act];if(fn){e.preventDefault();fn(b.dataset.id,b)}
});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target;FORMS[f.dataset.form]?.(new FormData(f))});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='q'){U.q=t.value;document.getElementById('grid').innerHTML=gridHTML()}
  if(t.id==='recibido'&&U.modal){U.modal.recibido=t.value;const o=ord(U.modal.oid);const tt=total(o);const pagar=tt+Math.round(tt*U.modal.prop/100/100)*100;document.getElementById('cambio').innerHTML=cambioHTML(+t.value.replace(/\D/g,''),pagar)}
  if(t.id==='ref'&&U.modal)U.modal.ref=t.value;
  if(t.id==='contado'){S.contado=t.value;save();const ps=pagadasTurno().filter(o=>o.pago.metodo==='efectivo');const esp=S.config.base+ps.reduce((a,o)=>a+o.pago.total+o.pago.propina,0);document.getElementById('dif').innerHTML=difHTML(esp,+t.value.replace(/\D/g,''))}
  if(t.dataset.tramo){const [i,k]=t.dataset.tramo.split(':');const x=S.config.tramos[+i];if(x){x[k]=+t.value||0;S.config.tramos.sort((a,b)=>a.km-b.km);save()}}
  if(t.dataset.opc&&t.type!=='checkbox'){const [i,k]=t.dataset.opc.split(':');const g=S.config.opciones[+i];if(g){if(k==='n')g.n=t.value;if(k==='items')g.items=t.value.split(',').map(x=>x.trim()).filter(Boolean);save()}}
  if(t.dataset.cfg){const k=t.dataset.cfg;S.config[k]=t.type==='checkbox'?(t.checked?1:0):t.type==='number'?(+t.value||0):t.value;save();if(k==='nombre')document.getElementById('brandSub').textContent=t.value}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='selMesero'){ord(U.active).mesero=t.value;save()}
  if(t.id==='qrMesa'){U.qrMesa=t.value;U.qrCart=[];render()}
  if(t.dataset.opc&&t.type==='checkbox'){const [i,,cat]=t.dataset.opc.split(':');const g=S.config.opciones[+i];if(g){g.cats=t.checked?[...new Set([...(g.cats||[]),cat])]:(g.cats||[]).filter(x=>x!==cat);t.closest('.chip')?.classList.toggle('on',t.checked);save()}}
  if(t.name==='tipo'&&t.form?.dataset.form==='pedido'){t.form.querySelector('.only-dom').hidden=t.value!=='domicilio'}
});
document.addEventListener('keydown',e=>{
  lastAct=now();
  if(e.key==='Escape'&&U.modal){U.modal=null;renderModal();return}
  const tgt=e.target;if(tgt&&/INPUT|TEXTAREA|SELECT/.test(tgt.tagName))return;
  const k=/^[0-9]$/.test(e.key)?e.key:e.key==='Backspace'?'b':null;if(!k)return;
  if(!yo()&&LOCK.sel){e.preventDefault();ACT.lockKey(k)}else if(U.modal&&U.modal.type==='auth'){e.preventDefault();ACT.authKey(k)}
});
['pointerdown','touchstart'].forEach(ev=>document.addEventListener(ev,()=>{lastAct=now()},{passive:true}));

/* reloj, temporizadores y refresco */
function tick(){
  const u=yo();const lim=+S.config.bloqueo||0;
  if(u&&lim>0&&u.rol!=='cocina'&&now()-lastAct>lim*MIN&&!U.modal){ACT.bloquear();toast('Pantalla bloqueada por inactividad')}
  document.getElementById('clock').textContent=new Date().toLocaleTimeString('es-CO',{hour:'numeric',minute:'2-digit',second:'2-digit'});
  document.querySelectorAll('[data-since]').forEach(el=>{const t=+el.dataset.since;el.textContent=clock(t);if(el.dataset.kds){const m=mins(t);el.classList.toggle('slow',m>=10&&m<15);el.classList.toggle('late',m>=15)}});
}
setInterval(tick,1000);
setInterval(()=>{const a=document.activeElement;if(!U.modal&&['mesas','cocina','caja'].includes(U.view)&&!(a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName)))render()},30000);
render();tick();
{const n0=NET;NET='';setNet(n0)}
setInterval(poll,5000);
setInterval(recibirBuzon,3000);recibirBuzon();
if(API.url)poll();
document.addEventListener('visibilitychange',()=>{if(!document.hidden){pantallaEncendida();if(API.url)poll()}});
if(VISTA_URL&&yo()&&ROLES[yo().rol].includes(VISTA_URL)){U.view=VISTA_URL;render()}
pantallaEncendida();
</script>
