<style>

}

.field{display:flex;flex-direction:column;gap:5px;font-size:.86rem;font-weight:600;color:var(--muted)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.row{display:flex;gap:8px;flex-wrap:wrap}
.row .btn{flex:1}

.status{text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center;padding-top:6px}
.status .no{font-family:var(--f-display);font-size:.9rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.08em}

.bills{display:flex;flex-wrap:wrap;gap:8px}.bill{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:9px 14px;font:inherit;font-weight:700;cursor:pointer}.bill.on{border-color:var(--accent);background:var(--accent-soft)}

/* ===== ingredientes y adicionales ===== */
// Lo que dice la descripción, separado por comas, "y" o "con" (mismo criterio que el servidor)
function ingDe(desc){
  const out=[];
  String(desc||'').split(/\.\s*/).forEach(fr=>fr.split(/,|\s+y\s+|\s+con\s+/i).forEach(x=>{
    x=x.trim().replace(/^con\s+/i,'');if(!x||/\d/.test(x)||x.length>30)return;
    x=x.charAt(0).toUpperCase()+x.slice(1);if(!out.some(o=>o.toLowerCase()===x.toLowerCase()))out.push(x)}));
  return out;
}
const extrasDe=p=>{const c=st.menu.extras;if(!c||!p||p.cat===c||p.est==='barra')return[];return st.menu.productos.filter(x=>x.cat===c)};
// Grupos de la carta (salsas, vegetales…) que aplican a la categoría del plato. "+Nombre" = se puede poner, no viene incluido
const gruposDe=p=>(st.menu.opciones||[]).filter(g=>g&&(g.cats||[]).includes(p.cat)).map(g=>({n:g.n,items:(g.items||[]).map(x=>String(x).trim()).filter(Boolean).map(x=>x[0]==='+'?{n:x.slice(1).trim(),base:false}:{n:x,base:true})})).filter(g=>g.items.length);
const tieneOpc=p=>ingDe(p.desc).length>0||extrasDe(p).length>0||gruposDe(p).length>0;
const unit=l=>{const p=prod(l.pid);return p?p.precio+l.ext.reduce((a,id)=>a+(prod(id)?.precio||0),0):0};
const minus=x=>/^[A-ZÁÉÍÓÚÑ][a-záéíóúñ]/.test(x)?x[0].toLowerCase()+x.slice(1):x;
const modsTxt=l=>[l.sin.length?'Sin '+l.sin.map(minus).join(', '):'',(l.con||[]).length?'Con '+l.con.map(minus).join(', '):'',...l.ext.map(id=>'+ '+(prod(id)?.nombre||'')),(l.nota||'').trim()].filter(Boolean).join(' · ');
const cartN=()=>st.cart.reduce((a,l)=>a+l.cant,0);
const cartT=()=>st.cart.reduce((a,l)=>a+unit(l)*l.cant,0);
const enCarrito=pid=>st.cart.filter(l=>l.pid===pid).reduce((a,l)=>a+l.cant,0);

const autoEnvio=()=>!!(st.menu&&st.menu.envio&&st.menu.envio.auto);

  return (st.menu.zonas[+st.form.zona]||{c:0}).c};

    let m={};try{m=JSON.parse(localStorage.getItem(PUENTE+'_estados')||'{}')}catch(e){}
    if(m[p.id])return{ok:true,pedido:m[p.id]};
    const d=JSON.parse(localStorage.getItem('dge_demo_'+p.id)||'null');if(!d)return{ok:false,error:'No encontramos ese pedido.'};

    return{ok:true,pedido:{id,clave:'demo',num:'—'}};
  }
  const items=b.items.map(i=>{const p=prod(i.pid);const l=normLinea(i);return{nombre:p.nombre,cant:l.cant,precio:unit(l),nota:modsTxt(l)}});

  return pc===tot?'<b>Pagas exacto, sin cambio.</b>':`<b>Te ${st.tipo==='domicilio'?'llevamos':'damos'} ${money(pc-tot)} de cambio.</b>`}
function efectivoHTML(tot){const f=st.form;const pc=pagaConN();

    ${i.estado==='rechazado'?`<div class="closed" role="alert"><b>No pudimos aprobar tu pedido.</b><br>${esc(i.motivoRechazo||'')}</div><p class="small muted" style="margin:0">${i.pagoPreferido==='efectivo'?'Si tienes dudas, escríbenos al <b>'+esc(m.negocio.tel)+'</b>.':'Si ya pagaste, escríbenos al <b>'+esc(m.negocio.tel)+'</b> con tu nombre y el pantallazo, y lo resolvemos.'}</p>`:''}
    ${!fin?`<div class="card"><ol class="steps">${ps.map((p,k)=>`<li class="${k<cur||(k===cur&&k===ps.length-1)?'done':k===cur?'now':''}"><span class="dot">${k<cur?'✓':k+1}</span><div><b>${p[1]}</b><span>${p[2]}</span></div></li>`).join('')}</ol></div>`:''}
    ${i.tipo!=='mesa'&&!fin&&i.pagoPreferido==='efectivo'&&!i.pagado?`<div class="payinfo"><b>Pagas en efectivo ${i.tipo==='domicilio'?'al recibir':'al recoger'} · ${money(i.total)}</b><span class="small">${+i.pagaCon>i.total?'Pagas con '+money(i.pagaCon)+': te '+(i.tipo==='domicilio'?'llevamos':'damos')+' '+money(i.pagaCon-i.total)+' de cambio.':'Pagas exacto, sin cambio.'}</span></div>`:''}
    ${i.tipo!=='mesa'&&!fin&&digital(i.pagoPreferido)&&MED_N[i.pagoPreferido]?`<div class="payinfo ${i.estado==='por_aprobar'?'':'ok'}"><b>${i.estado==='por_aprobar'?'Comprobante enviado':'Pago aprobado'} · ${MED_N[i.pagoPreferido]}</b><span class="small">${i.estado==='por_aprobar'?'En cuanto lo verifiquemos tu pedido pasa a cocina.':'Gracias, ya no tienes que pagar nada más.'}</span></div>`:''}
    <div class="card"><h3>${i.tipo==='mesa'?'Lo que va pedido en la mesa':'Detalle'}</h3>
      ${i.items.map(l=>`<div class="line"><div><div class="nm">${l.cant}× ${esc(l.nombre)}</div>${l.nota?`<div class="lp">${esc(l.nota)}</div>`:''}</div><span class="num">${money(l.precio*l.cant)}</span></div>`).join('')}
      <div class="sum"><div class="tot"><span>Total</span><span>${money(i.total)}</span></div></div></div>
    ${i.tipo==='mesa'&&i.estado!=='pagado'?`<div class="row"><button class="btn" data-a="aviso" data-v="mesero">Llamar al mesero</button><button class="btn" data-a="aviso" data-v="cuenta" ${i.cuentaPedida?'disabled':''}>${i.cuentaPedida?'Cuenta pedida ✓':'Pedir la cuenta'}</button></div>`:''}
    ${['entregado','pagado','anulado','rechazado'].includes(i.estado)?`<button class="btn primary big" data-a="nuevo">Hacer un pedido nuevo</button>`:''}
  </div>`;
}
function renderSheet(){
  const el=document.getElementById('sheet');const b=document.getElementById('shBody');const y=b?b.scrollTop:0;
  const s=st.sheet;const p=s&&st.menu?prod(s.pid):null;
  if(!p){el.innerHTML='';el.dataset.k='';document.body.classList.remove('lock');return}
  const k=s.pid+'#'+(s.edit||'');const box=el.querySelector('.sheet');
  // Al tocar un ingrediente solo se redibuja el contenido: la hoja no vuelve a animarse
  if(box&&el.dataset.k===k)box.innerHTML=sheetHTML();
  else{el.innerHTML=`<div class="sheet-bg" data-a="cerrarOpc"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(p.nombre)}">${sheetHTML()}</div>`;el.dataset.k=k}
  const nb=document.getElementById('shBody');if(nb)nb.scrollTop=y;
  document.body.classList.add('lock');
}
function render(){
  const a=document.activeElement;const keep=a&&a.id==='q'?a.selectionStart:null;
  document.getElementById('app').innerHTML=!st.menu?`<div class="wrap page"><p class="empty">${st.err?esc(st.err):'Cargando la carta…'}</p></div>`:({menu:vMenu,carrito:vCarrito,estado:vEstado}[st.view])();
  if(keep!==null){const q=document.getElementById('q');if(q){q.focus();q.setSelectionRange(keep,keep)}}
  renderSheet();
}

/* ===== captura del pago: se reduce en el teléfono antes de enviarla ===== */
async function comprimir(file){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((ok,ko)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=ko;i.src=url});
    const k=Math.min(1,1400/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);
    const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(img,0,0,c.width,c.height);
    return c.toDataURL('image/jpeg',0.72);
  }finally{URL.revokeObjectURL(url)}
}

/* ===== acciones ===== */
const A={
  tipo:v=>{st.tipo=v;st.err=null;persist();render()},
  cotizar:()=>cotizar(),
  gps:()=>{if(!navigator.geolocation){toast('Tu teléfono no permite compartir la ubicación. Escribe la dirección.','bad');return}
    toast('Buscando tu ubicación…');
    navigator.geolocation.getCurrentPosition(p=>{st.gps={lat:+p.coords.latitude.toFixed(6),lng:+p.coords.longitude.toFixed(6)};cotizar()},
      ()=>toast('No pudimos tomar tu ubicación. Revisa el permiso o escribe la dirección.','bad'),{enableHighAccuracy:true,timeout:15000,maximumAge:60000})},
  cat:v=>{st.cat=v||null;render()},
  inc:v=>{agregarLinea({pid:v,cant:1});persist();render()},
  dec:v=>{const l=st.cart.find(x=>x.k===simpleK(v));if(!l)return;l.cant--;if(l.cant<=0)st.cart=st.cart.filter(x=>x!==l);persist();render()},
  lInc:k=>{const l=st.cart.find(x=>x.k===k);if(l)l.cant=Math.min(20,l.cant+1);persist();render()},
  lDec:k=>{const l=st.cart.find(x=>x.k===k);if(!l)return;l.cant--;if(l.cant<=0)st.cart=st.cart.filter(x=>x!==l);persist();render()},
  opc:v=>{if(!st.menu.abierto){toast('En este momento no estamos recibiendo pedidos','bad');return}st.sheet={pid:v,sin:[],con:[],ext:[],cant:1,nota:'',edit:null};renderSheet()},
  editar:k=>{const l=st.cart.find(x=>x.k===k);if(!l)return;st.sheet={pid:l.pid,sin:[...l.sin],con:[...(l.con||[])],ext:[...l.ext],cant:l.cant,nota:l.nota,edit:k};renderSheet()},
  tSin:v=>{const s=st.sheet;s.sin=s.sin.includes(v)?s.sin.filter(x=>x!==v):[...s.sin,v];renderSheet()},
  tCon:v=>{const s=st.sheet;s.con=s.con.includes(v)?s.con.filter(x=>x!==v):[...s.con,v];renderSheet()},
  tExt:v=>{const s=st.sheet;s.ext=s.ext.includes(v)?s.ext.filter(x=>x!==v):[...s.ext,v];renderSheet()},
  shInc:()=>{st.sheet.cant=Math.min(20,st.sheet.cant+1);renderSheet()},
  shDec:()=>{st.sheet.cant=Math.max(1,st.sheet.cant-1);renderSheet()},
  cerrarOpc:()=>{st.sheet=null;renderSheet()},
  shOk:()=>{const s=st.sheet;if(s.edit)st.cart=st.cart.filter(x=>x.k!==s.edit);
    agregarLinea({pid:s.pid,cant:s.cant,sin:s.sin,con:s.con,ext:s.ext,nota:s.nota.trim()});st.sheet=null;persist();render();toast(s.edit?'Cambios guardados':'Agregado a tu pedido')},
  carrito:()=>{st.view='carrito';st.err=null;render();scrollTo(0,0)},
  menu:()=>{st.view='menu';render();scrollTo(0,0)},
  verEstado:()=>{st.view='estado';render();scrollTo(0,0);estado()},
  enviar:async()=>{
    const m=st.menu,f=st.form;st.err=null;
    if(!m.mesa){
      if(!st.tipo)return fail('Elige si es a domicilio o lo recoges en el local.');
      if(!f.nombre.trim())return fail('Escribe tu nombre.');
      if(f.tel.replace(/\D/g,'').length<7)return fail('Escribe un celular válido.');
      if(st.tipo==='domicilio'&&!f.direccion.trim())return fail('Escribe la dirección de entrega.');
      if(st.tipo==='domicilio'&&autoEnvio()){
        if(!st.cot||st.cot.error||(!st.gps&&st.cotDir!==f.direccion.trim()))return fail('Toca "Calcular domicilio" para saber cuánto vale el envío antes de pagar.');
        if(st.cot.fuera)return fail('No llegamos hasta esa dirección. Puedes elegir "Recoger en el local".');
      }
      if(!medios().includes(f.pago))return fail(medios().includes('efectivo')?'Elige cómo vas a pagar.':'Elige por dónde pagaste.');
      if(f.pago==='efectivo'){const tot=cartT()+envio();
        if(!f.pagaCon)return fail('Dinos con cuánto vas a pagar para tener listo tu cambio (o toca "Exacto").');
        if(pagaConN()<tot)return fail('El efectivo con el que pagas debe ser de '+money(tot)+' o más.');}
      else if(!st.cmp)return fail('Sube la captura del pago para enviar el pedido.');
    }
    st.sending=true;render();
    try{
      const body={action:'pedidoCliente',items:st.cart.map(l=>({pid:l.pid,cant:l.cant,sin:l.sin,con:l.con,ext:l.ext,nota:l.nota||''}))};
      if(m.mesa)Object.assign(body,{mesa:MESA,codigo:COD});
      else Object.assign(body,{tipo:st.tipo,cliente:f.nombre.trim(),tel:f.tel.trim(),direccion:f.direccion.trim(),mun:munSel(),zona:f.zona,lat:st.cot&&!st.cot.error?st.cot.lat:'',lng:st.cot&&!st.cot.error?st.cot.lng:'',pago:f.pago,nota:f.nota.trim(),...(f.pago==='efectivo'?{pagaCon:pagaConN()}:{comprobante:st.cmp})});
      const r=await apiPost(body);if(!r.ok)throw new Error(r.error||'No se pudo enviar el pedido.');
      st.pedido=r.pedido;st.cart=[];st.cmp=null;st.cot=null;st.gps=null;st.info=null;st.view='estado';persist();
      toast(m.mesa?'Listo, tu pedido ya está en cocina':f.pago==='efectivo'?'Pedido enviado. Lo confirmamos en un momento':'Pedido enviado. Estamos revisando tu pago');
      scrollTo(0,0);await estado();
    }catch(e){st.err=e.message==='Failed to fetch'?'No hay conexión. Revisa tu internet e intenta de nuevo.':e.message}
    finally{st.sending=false;render()}
  },
  pagaCon:v=>{st.form.pagaCon=String(v);st.err=null;persist();render()},
  aviso:async v=>{
    try{const r=await apiPost({action:'mesaAviso',mesa:MESA,codigo:COD,tipo:v});if(!r.ok)throw new Error(r.error);
      if(v==='cuenta'&&st.info)st.info.cuentaPedida=true;render();toast(v==='cuenta'?'Ya le avisamos a caja y al mesero':'El mesero ya viene')}
    catch(e){toast(e.message||'No se pudo enviar el aviso','bad')}
  },
  copiar:()=>{const t=document.getElementById('cuenta').textContent;try{navigator.clipboard.writeText(t).then(()=>toast('Copiado'),()=>toast('Mantén presionado para copiar'))}catch(e){toast('Mantén presionado para copiar')}},
  nuevo:()=>{st.pedido=null;st.info=null;st.view='menu';persist();render()},
  demoMesa:()=>{history.replaceState(null,'','?m=M3&c=demo');MESA='M3';COD='demo';boot()},
  demoWeb:()=>{history.replaceState(null,'',location.pathname);MESA=null;COD=null;boot()}
};
function fail(msg){st.err=msg;render();document.querySelector('[role=alert]')?.scrollIntoView({behavior:'smooth',block:'center'})}
async function estado(){
  if(!st.pedido)return;
  try{const r=await apiGet({action:'pedido',id:st.pedido.id,k:st.pedido.clave});
    if(!r.ok){if(/No encontramos/.test(r.error||'')){st.pedido=null;persist()}return}
    const antes=st.info?.estado;st.info=r.pedido;
    if(antes&&antes!==r.pedido.estado){toast(txtEstado(r.pedido.estado,r.pedido.tipo));try{navigator.vibrate&&navigator.vibrate(150)}catch(e){}}
    const a=document.activeElement;if(!st.sheet&&!(a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName)))render();
  }catch(e){}
}

document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;e.preventDefault();A[b.dataset.a]?.(b.dataset.v)});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='q'){st.q=t.value;const y=scrollY;render();scrollTo(0,y)}
  if(t.id==='shNota'&&st.sheet)st.sheet.nota=t.value;
  if(t.id==='pagaCon'){st.form.pagaCon=t.value;persist();const c=document.getElementById('cambioTxt');if(c)c.innerHTML=cambioTxt(cartT()+envio());document.querySelectorAll('.bill').forEach(b=>b.classList.toggle('on',+b.dataset.v===pagaConN()));return}
  if(t.dataset.f){st.form[t.dataset.f]=t.value;persist();if(['zona','pago'].includes(t.dataset.f))render()}
  if(t.dataset.f==='direccion'&&st.cot&&!st.gps&&st.cotDir!==t.value.trim()){st.cot=null}
});
document.addEventListener('change',async e=>{const t=e.target;
  if(t.id==='cmpFile'&&t.files&&t.files[0]){try{st.cmp=await comprimir(t.files[0]);st.err=null;render()}catch(x){toast('No pudimos leer esa imagen. Prueba con otro pantallazo.','bad')}return}
  if(t.id==='pagaCon')return;
  if(t.dataset.f){st.form[t.dataset.f]=t.value;persist();if(t.dataset.f==='mun'&&!st.gps)st.cot=null;if(['zona','pago','mun'].includes(t.dataset.f))render()}});
document.addEventListener('submit',e=>e.preventDefault());
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&st.sheet){st.sheet=null;renderSheet()}});

async function boot(){
  st.menu=null;st.err=null;st.view='menu';st.info=null;st.sheet=null;restore();
  if(qs.get('p')&&qs.get('k')&&!MESA){st.pedido={id:qs.get('p'),clave:qs.get('k'),num:'—'};persist();history.replaceState(null,'',location.pathname)}
  render();
  try{
    const r=await apiGet(Object.assign({action:'menu'},MESA?{m:MESA,c:COD}:{}));
    if(!r.ok)throw new Error(r.error||'No se pudo cargar la carta.');
    st.menu=r;document.title=r.negocio.nombre+(r.mesa?' · Mesa '+r.mesa.nombre:' · Carta');
    st.cart=st.cart.filter(l=>prod(l.pid));
    if(st.pedido){st.view='estado';estado()}
  }catch(e){st.err=e.message==='Failed to fetch'?'No hay conexión. Revisa tu internet y recarga la página.':e.message}
  render();
}
setInterval(()=>{if(st.pedido&&!document.hidden)estado()},8000);
window.addEventListener('storage',e=>{if(DEMO&&e.key===PUENTE+'_estados')estado()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)estado()});
boot();
</script>
